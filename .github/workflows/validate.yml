name: Validate application

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, security/age-checkout-guardrails]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run lint
        run: npx eslint . --rule '@typescript-eslint/no-explicit-any: off' --rule '@typescript-eslint/no-require-imports: off'
      - name: Run tests
        run: npm test -- --passWithNoTests
      - name: Build production bundle
        run: npm run build
