name: Validate application

permissions:
  contents: write

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, security/age-checkout-guardrails]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate and verify npm lockfile
        run: |
          npm install --package-lock-only --no-audit --no-fund
          npm ci --no-audit --no-fund
      - name: Commit synchronized lockfile to security branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/security/age-checkout-guardrails'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'chore: synchronize npm lockfile'
            git push
          fi
      - name: Lint changed application and security files
        run: >-
          npx eslint
          src/App.tsx
          src/pages/Cadastro.tsx
          src/pages/EscolherPlano.tsx
          src/pages/OnboardingSaude.tsx
          src/pages/ResponsavelContratar.tsx
          src/pages/VerificarEmail.tsx
          src/pages/dashboard/Configuracoes.tsx
          supabase/functions/adaptar-dieta/index.ts
          supabase/functions/check-subscription/index.ts
          supabase/functions/create-checkout/index.ts
          supabase/functions/create-guardian-request/index.ts
          supabase/functions/customer-portal/index.ts
          supabase/functions/guardian-checkout/index.ts
          --rule '@typescript-eslint/no-explicit-any: off'
          --rule '@typescript-eslint/no-require-imports: off'
      - name: Run tests
        run: npm test -- --passWithNoTests
      - name: Build production bundle
        run: npm run build
